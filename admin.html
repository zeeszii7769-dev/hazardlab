
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ระบบจัดการแอดมิน</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #13161b; color: #ffffff; padding: 30px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .login-box {
            max-width: 400px; margin: 80px auto; background: #1c2028;
            border: 1px solid #2c323d; border-radius: 12px; padding: 30px; text-align: center;
        }
        .login-box h2 { margin-bottom: 10px; font-size: 20px; }
        .login-box p { color: #8c95a6; font-size: 13px; margin-bottom: 20px; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid #262b34; margin-bottom: 30px;
        }
        .header-btns { display: flex; gap: 10px; }
        .btn-back {
            background: #2c323d; color: #fff; text-decoration: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold;
        }
        .btn-logout {
            background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .card {
            background: #1c2028; border: 1px solid #2c323d; border-radius: 12px;
            padding: 25px; margin-bottom: 30px;
        }
        .card h3 { margin-bottom: 20px; font-size: 18px; color: #2d7ff9; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #8c95a6; margin-bottom: 6px; }
        .form-control {
            width: 100%; background: #13161b; border: 1px solid #2c323d;
            border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px;
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-create {
            background: #2d7ff9; color: #fff; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px;
        }
        .btn-create:hover { background: #1e6ce0; }
        .market-item {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
            background: #232832; padding: 15px; border-radius: 8px; margin-bottom: 12px;
        }
        .badge {
            font-size: 11px; padding: 3px 8px; border-radius: 12px;
            background: #2c323d; color: #8c95a6; margin-left: 8px;
        }
        .action-btns { display: flex; gap: 8px; }
        .btn-win-yes {
            background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .btn-win-no {
            background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .btn-delete {
            background: #3a4252; color: #fff; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
    </style>
</head>
<body>

       <!-- หน้าต่างล็อกอินป้องกันแอดมิน -->
    <div id="loginSection" class="login-box">
        <h2>🔒 ยืนยันตัวตนแอดมิน</h2>
        <p>กรุณากรอก ID และรหัสผ่านผู้ดูแลระบบเพื่อเข้าจัดการตลาดคาดการณ์</p>
        <div class="form-group">
            <input type="text" id="adminUser" class="form-control" placeholder="กรอก Admin ID..." onkeyup="if(event.key==='Enter') checkLogin()">
        </div>
        <div class="form-group">
            <input type="password" id="adminPass" class="form-control" placeholder="กรอกรหัสผ่านแอดมิน..." onkeyup="if(event.key==='Enter') checkLogin()">
        </div>
        <button class="btn-create" onclick="checkLogin()">เข้าสู่ระบบแอดมิน</button>
        <div style="margin-top: 15px;">
            <a href="index.html" style="color: #8c95a6; font-size: 12px; text-decoration: none;">← กลับหน้าเว็บไซต์หลัก</a>
        </div>
    </div>

    <!-- เนื้อหาหน้าแอดมิน (ซ่อนไว้จนกว่าจะล็อกอินผ่าน) -->
    <div id="adminContent" class="container" style="display: none;">
        <div class="header">
            <h2>🛠️ ระบบจัดการแอดมิน (Admin Panel)</h2>
            <div class="header-btns">
                <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
                <button class="btn-logout" onclick="logoutAdmin()">ออกจากระบบ</button>
            </div>
        </div>

        <div class="card">
            <h3>➕ สร้างหัวข้อทายผลใหม่</h3>
            <div class="form-group">
                <label>หัวข้อคำถาม (เช่น Bitcoin จะทะลุ $150,000 ในปีนี้หรือไม่?)</label>
                <input type="text" id="newTitle" class="form-control" placeholder="พิมพ์คำถามที่ต้องการเปิดให้ทายผล...">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select id="newCategory" class="form-control">
                        <option value="tech">เทคโนโลยี & AI</option>
                        <option value="politics">การเมือง</option>
                        <option value="game">เกม & Esports</option>
                        <option value="finance">การเงิน</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>โอกาสฝั่ง Yes เริ่มต้น (%)</label>
                    <input type="number" id="newYesPercent" class="form-control" value="50" min="1" max="99">
                </div>
            </div>
            <button class="btn-create" onclick="addMarket()">เปิดตลาดทายผลนี้</button>
        </div>

        <div class="card">
            <h3>⚖️ จัดการตลาดที่เปิดอยู่ และ กดตัดสินผลแพ้-ชนะ</h3>
            <div id="adminMarketList"></div>
        </div>
    </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // เชื่อมต่อ Supabase (ใช้ตัวแปรกลางร่วมกับสคริปต์ด้านล่าง)
  const SUPABASE_URL =  'https://yzxaylzwgtpzqhfxmjqs.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_uGceFDQrnJP2ZGPoB_0NVw_TZgskFHU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let markets = [];

  // 1. ตรวจสอบสถานะการล็อกอินและสิทธิ์แอดมินจริงจากฐานข้อมูล
  async function verifyAdminSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;

    const { data: profile } = await sb
      .from('profiles')
      .select('is_admin')
      .eq('id', session.user.id)
      .single();

    if (profile && profile.is_admin) {
      showAdminPanel();
    } else {
      await sb.auth.signOut();
      alert('❌ บัญชีนี้ไม่มีสิทธิ์เข้าถึงระบบแอดมิน');
    }
  }

  // 2. ฟังก์ชันกดปุ่มเข้าสู่ระบบ (กรอกอีเมล adminzaqc.038@gmail.com และรหัสผ่านที่ตั้งใน Supabase)
  async function checkLogin() {
    const inputEmail = document.getElementById('adminUser').value.trim();
    const inputPass = document.getElementById('adminPass').value;

    if (!inputEmail || !inputPass) {
      alert('กรุณากรอกอีเมลและรหัสผ่านแอดมิน');
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({
      email: inputEmail,
      password: inputPass
    });

    if (error) {
      alert('❌ อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้อง!');
      document.getElementById('adminPass').value = '';
      return;
    }

    await verifyAdminSession();
  }

  function showAdminPanel() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    loadSupabaseMarkets();
  }

  async function logoutAdmin() {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }

  // 3. โหลดรายการตลาดทั้งหมดจากตาราง markets ใน Supabase
  async function loadSupabaseMarkets() {
    const { data, error } = await sb
      .from('markets')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error && data) {
      markets = data;
      renderAdminMarkets();
    }
  }

  // 4. สร้างหัวข้อทายผลใหม่ลงฐานข้อมูลกลาง (ทุกคนเห็นพร้อมกันทันที)
  async function addMarket() {
    const title = document.getElementById('newTitle').value.trim();
    const category = document.getElementById('newCategory').value;
    const yes = parseInt(document.getElementById('newYesPercent').value) || 50;

    if (!title) return alert('กรุณากรอกหัวข้อคำถามก่อนครับ');
    if (yes < 1 || yes > 99) return alert('กรุณาใส่เปอร์เซ็นต์ระหว่าง 1 ถึง 99');

    const { error } = await sb
      .from('markets')
      .insert([{ title: title, category: category, yes_percent: yes, status: 'open' }]);

    if (error) {
      alert('❌ สร้างหัวข้อไม่สำเร็จ (ไม่มีสิทธิ์แอดมิน): ' + error.message);
      return;
    }

    document.getElementById('newTitle').value = '';
    alert('✅ เพิ่มหัวข้อทายผลลงฐานข้อมูลเรียบร้อยแล้ว!');
    loadSupabaseMarkets();
  }

  // 5. ตัดสินผลแพ้-ชนะ และจ่ายเงินรางวัลเข้ากระเป๋าผู้เล่นที่ทายถูกใน Supabase
  async function resolveMarket(id, winner) {
    const market = markets.find(m => m.id === id);
    if (!market || market.status !== 'open') return;

    if (!confirm(`ยืนยันการตัดสินให้ "${market.title}" จบลงที่ฝั่ง [ ${winner} ] ชนะ ใช่หรือไม่?`)) return;

    // อัปเดตสถานะตลาดใน Supabase
    const { error } = await sb
      .from('markets')
      .update({ status: 'resolved', winner: winner })
      .eq('id', id);

    if (error) return alert('❌ เกิดข้อผิดพลาด: ' + error.message);

    // ค้นหาบิลที่ทายถูกทั้งหมดในตาราง bets
    const { data: winningBets } = await sb
      .from('bets')
      .select('*')
      .eq('market_title', market.title)
      .eq('choice', winner)
      .eq('status', 'pending');

    let winnerCount = 0;
    let totalPaidAllUsers = 0;

    if (winningBets && winningBets.length > 0) {
      for (const bet of winningBets) {
        await sb.from('bets').update({ status: 'won' }).eq('id', bet.id);

        const { data: prof } = await sb
          .from('profiles')
          .select('balance')
          .eq('id', bet.user_id)
          .single();

        if (prof) {
          const prize = parseFloat(bet.payout);
          const newBal = Number((Number(prof.balance) + prize).toFixed(2));
          await sb.from('profiles').update({ balance: newBal }).eq('id', bet.user_id);
          winnerCount++;
          totalPaidAllUsers += prize;
        }
      }
    }

    // ปรับบิลฝั่งที่ทายผิดเป็น lost
    await sb
      .from('bets')
      .update({ status: 'lost' })
      .eq('market_title', market.title)
      .neq('choice', winner)
      .eq('status', 'pending');

    alert(`✅ ตัดสินผลเรียบร้อย! จ่ายเงินรางวัลให้ผู้ชนะทั้งหมด ${winnerCount} รายการ รวมเป็นเงิน $${totalPaidAllUsers.toFixed(2)}`);
    loadSupabaseMarkets();
  }

  // 6. ลบหัวข้อออกจากฐานข้อมูล
  async function deleteMarket(id) {
    if (!confirm('ต้องการลบหัวข้อนี้ออกจากฐานข้อมูลใช่หรือไม่?')) return;
    const { error } = await sb.from('markets').delete().eq('id', id);
    if (!error) loadSupabaseMarkets();
  }

  // 7. แสดงรายการตลาดบนหน้าจอแอดมิน
  function renderAdminMarkets() {
    const listDiv = document.getElementById('adminMarketList');
    if (markets.length === 0) {
      listDiv.innerHTML = '<p style="color:#8c95a6;">ยังไม่มีหัวข้อทายผลในฐานข้อมูล</p>';
      return;
    }

    listDiv.innerHTML = markets.map(m => `
      <div class="market-item">
        <div>
          <strong>${m.title}</strong>
          <span class="badge">${m.category}</span>
          <div style="font-size:12px; color:#8c95a6; margin-top:4px;">
            ราคาปัจจุบัน: Yes ${m.yes_percent}% | No ${100 - m.yes_percent}%
            ${m.status !== 'open' ? `<strong style="color:#f59e0b; margin-left:8px;">(จบเกม: ${m.winner} ชนะ)</strong>` : ''}
          </div>
        </div>
        <div class="action-btns">
          ${m.status === 'open' ? `
            <button class="btn-win-yes" onclick="resolveMarket('${m.id}', 'Yes')">ตัดสิน Yes ชนะ</button>
            <button class="btn-win-no" onclick="resolveMarket('${m.id}', 'No')">ตัดสิน No ชนะ</button>
          ` : ''}
          <button class="btn-delete" onclick="deleteMarket('${m.id}')">ลบ</button>
        </div>
      </div>
    `).join('');
  }

  // เช็กสิทธิ์ทันทีที่เปิดหน้าเว็บ
  verifyAdminSession();
</script>

    <script>
// ซิงก์รายการตลาดเรียลไทม์จาก Polymarket ให้ตรงกับหน้าเว็บหลัก
(function() {
    let hiddenIds = JSON.parse(localStorage.getItem('hiddenPolymarketIds')) || [];
    let pinnedId = localStorage.getItem('pinnedPolymarketId') || '';

    window.toggleHidePolymarket = function(id) {
        if (hiddenIds.includes(id)) {
            hiddenIds = hiddenIds.filter(item => item !== id);
        } else {
            hiddenIds.push(id);
        }
        localStorage.setItem('hiddenPolymarketIds', JSON.stringify(hiddenIds));
        loadAdminPolymarket();
    };

    window.togglePinPolymarket = function(id) {
        pinnedId = (pinnedId === id) ? '' : id;
        localStorage.setItem('pinnedPolymarketId', pinnedId);
        loadAdminPolymarket();
    };

    async function loadAdminPolymarket() {
        let container = document.getElementById('polymarketAdminSection');
        if (!container) {
            const target = document.querySelector('.container') || document.body;
            container = document.createElement('div');
            container.id = 'polymarketAdminSection';
            container.style.cssText = 'margin-top: 30px; background: #1c2028; border: 1px solid #2c323d; border-radius: 12px; padding: 20px;';
            target.appendChild(container);
        }

        container.innerHTML = '<h3 style="margin-bottom:15px; color:#10b981;">🟢 ตลาดเรียลไทม์จาก Polymarket (ซิงก์ตรงกับหน้าเว็บหลัก)</h3><p style="color:#8c95a6; font-size:13px;">กำลังโหลดรายการ...</p>';

        try {
            const res = await fetch('https://gamma-api.polymarket.com/events?closed=false&limit=13&order=volume&ascending=false');
            const events = await res.json();

            const rowsHtml = events.map(ev => {
                const isHidden = hiddenIds.includes(String(ev.id));
                const isPinned = (pinnedId === String(ev.id));
                const m = (ev.markets && ev.markets[0]) || {};
                let prob = 50;
                try {
                    const p = typeof m.outcomePrices === 'string' ? JSON.parse(m.outcomePrices) : m.outcomePrices;
                    if (Array.isArray(p) && p.length > 0) prob = Math.round(parseFloat(p[0]) * 100);
                } catch (e) {}

                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; background:#232832; padding:12px 16px; border-radius:8px; margin-bottom:10px; opacity:${isHidden ? '0.5' : '1'}; border: 1px solid ${isPinned ? '#f59e0b' : 'transparent'};">
                        <div>
                            <strong style="color:#fff;">${ev.title}</strong>
                            <div style="font-size:12px; color:#8c95a6; margin-top:4px;">ราคาปัจจุบัน: Yes ${prob}% | No ${100 - prob}% ${isPinned ? '• <span style="color:#f59e0b;">📌 ปักหมุดการ์ดเด่น</span>' : ''} ${isHidden ? '• <span style="color:#ef4444;">🚫 ซ่อนอยู่</span>' : ''}</div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button onclick="togglePinPolymarket('${ev.id}')" style="background:${isPinned ? '#f59e0b' : '#2c323d'}; color:${isPinned ? '#000' : '#fff'}; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer;">
                                ${isPinned ? 'ยกเลิกปักหมุด' : '📌 ปักหมุดเด่น'}
                            </button>
                            <button onclick="toggleHidePolymarket('${ev.id}')" style="background:${isHidden ? '#10b981' : '#ef4444'}; color:${isHidden ? '#000' : '#fff'}; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer;">
                                ${isHidden ? '👁️ แสดงบนเว็บ' : '🚫 ซ่อน'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <h3 style="margin-bottom:15px; color:#10b981;">🟢 ตลาดเรียลไทม์จาก Polymarket (${events.length} รายการล่าสุด)</h3>
                ${rowsHtml}
            `;
        } catch (err) {
            container.innerHTML = '<p style="color:#ef4444;">ไม่สามารถโหลดข้อมูลจาก Polymarket ได้ชั่วคราว</p>';
        }
    }

    window.addEventListener('DOMContentLoaded', loadAdminPolymarket);
})();
</script>
<!-- เชื่อมต่อฐานข้อมูลกลาง Supabase สำหรับหน้าแอดมิน -->

<script>
(function() {
    const SUPABASE_URL = 'https://yzxaylzwgtpzqhfxmjqs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uGceFDQrnJP2ZGPoB_0NVw_TZgskFHU';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.settleSupabaseBet = async function(betId, userId, payout, isWin) {
        if (!confirm(isWin ? `ยืนยันจ่ายเงินรางวัล $${payout} ให้ผู้เล่นนี้ใช่หรือไม่?` : 'ยืนยันตัดสินรายการนี้เป็นแพ้ใช่หรือไม่?')) return;

        await sb.from('bets').update({ status: isWin ? 'win' : 'lose' }).eq('id', betId);

        if (isWin) {
            const { data: prof } = await sb.from('profiles').select('balance').eq('id', userId).single();
            if (prof) {
                const updatedBal = Number((Number(prof.balance) + Number(payout)).toFixed(2));
                await sb.from('profiles').update({ balance: updatedBal }).eq('id', userId);
            }
        }
        loadAllSupabaseBets();
    };

    async function loadAllSupabaseBets() {
        const target = document.querySelector('.container') || document.body;
        let box = document.getElementById('supabaseAdminBetsBox');
        if (!box) {
            box = document.createElement('div');
            box.id = 'supabaseAdminBetsBox';
            box.style.cssText = 'margin-top:30px;background:#1c2028;border:1px solid #2d7ff9;border-radius:12px;padding:20px;';
            target.prepend(box);
        }

        const { data: bets, error } = await sb.from('bets').select('*').order('created_at', { ascending: false });
        if (error) {
            box.innerHTML = `<p style="color:#ef4444;">โหลดข้อมูลไม่สำเร็จ: ${error.message}</p>`;
            return;
        }

        const rows = (!bets || bets.length === 0)
            ? '<p style="color:#8c95a6;font-size:13px;">ยังไม่มีรายการทายผลในฐานข้อมูลกลาง</p>'
            : bets.map(b => {
                const isPending = b.status === 'pending';
                const statusBadge = b.status === 'win'
                    ? '<span style="color:#10b981;font-weight:bold;">🏆 ชนะ (จ่ายแล้ว)</span>'
                    : b.status === 'lose'
                    ? '<span style="color:#ef4444;font-weight:bold;">❌ แพ้</span>'
                    : '<span style="color:#f59e0b;font-weight:bold;">⏳ รอตัดสิน</span>';

                return `
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:#232832;padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:13px;">
                        <div>
                            <span style="background:#2d7ff9;color:#fff;padding:2px 8px;border-radius:4px;font-weight:bold;margin-right:8px;">👤 ${b.user_name}</span>
                            <strong style="color:#fff;">${b.market_title}</strong>
                            <span style="margin-left:8px;color:${b.choice === 'Yes' ? '#10b981' : '#ef4444'};font-weight:bold;">[${b.choice} @ ${b.percent}%]</span>
                            <div style="font-size:12px;color:#8c95a6;margin-top:4px;">ลงเงิน: $${b.amount} • รับหากชนะ: $${b.payout} • สถานะ: ${statusBadge}</div>
                        </div>
                        ${isPending ? `
                        <div style="display:flex;gap:6px;">
                            <button onclick="settleSupabaseBet(${b.id}, '${b.user_id}', ${b.payout}, true)" style="background:#10b981;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;">✅ ชนะ</button>
                            <button onclick="settleSupabaseBet(${b.id}, '${b.user_id}', 0, false)" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;">❌ แพ้</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');

        box.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3 style="color:#2d7ff9;margin:0;">🌐 รายการทายผลจากฐานข้อมูลกลาง (${bets ? bets.length : 0} รายการ)</h3>
                <button onclick="location.reload()" style="background:#2c323d;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;">🔄 รีเฟรช</button>
            </div>
            ${rows}
        `;
    }

    window.addEventListener('DOMContentLoaded', loadAllSupabaseBets);
})();
</script>

</body>
</html>
